<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ぬりつぶし">
<meta name="theme-color" content="#f6f3ef">
<title>市町村ぬりつぶし</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--ink:#3f3b37;--sub:#8a837b;--line:#e4ded6;--bg:#f6f3ef;--card:#fffdfa;--soft:#eee9e2;--acc:#a9776a;--acc-d:#8a5d51;
  --sea:#d3dbdb;--land:#e7e1d8;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.55 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input{font:inherit;color:inherit}button{cursor:pointer}
header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(246,243,239,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(var(--st) + 10px) 12px 10px}
.top{display:flex;align-items:baseline;gap:12px;padding:0 4px 8px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.04em}
#count{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap}#count b{font-size:22px;color:var(--acc-d);margin-right:3px}
.search{position:relative}
#q{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px 0 40px;font-size:16px;background:var(--card)}
#q:focus{outline:2px solid var(--acc);outline-offset:0}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--sub);pointer-events:none}
#results{position:absolute;left:0;right:0;top:50px;background:var(--card);border-radius:12px;box-shadow:0 10px 30px rgba(60,50,40,.18);display:none;max-height:50vh;overflow-y:auto}
#results.on{display:block}
#results button{display:flex;width:100%;border:0;background:none;text-align:left;padding:10px 14px;min-height:48px;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
#results small{color:var(--sub)}
#results i{width:14px;height:14px;border-radius:4px;flex:none;margin-left:auto;background-size:cover;background-position:center}
#loadinfo{font-size:12px;color:var(--sub);margin:6px 4px 0}#loadinfo:empty{display:none}
#map{position:fixed;inset:0;z-index:1;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:inherit}
.leaflet-control-attribution{font-size:10px;background:rgba(246,243,239,.8)!important;color:var(--sub)}
.leaflet-bottom{bottom:calc(56px + var(--sb))}
.seg{position:fixed;left:12px;top:calc(var(--st) + 124px);z-index:900;display:flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 4px 16px rgba(60,50,40,.14)}
.seg button{border:0;background:none;border-radius:999px;min-height:38px;padding:0 16px;font-size:14px;font-weight:700;color:var(--sub)}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;z-index:1100;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:var(--sb)}
nav button{border:0;background:none;height:56px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button[aria-current=true]{color:var(--acc-d);font-weight:700}
.panel{position:fixed;left:0;right:0;top:0;bottom:calc(56px + var(--sb));z-index:950;background:var(--bg);overflow-y:auto;padding:calc(var(--st) + 128px) 16px 32px;display:none}
.panel.on{display:block}
.panel h2{font-size:20px;margin:8px 0 12px}
.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:20px}
.big div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.big b{display:block;font-size:28px;line-height:1.1;color:var(--acc-d)}.big span{font-size:13px;color:var(--sub)}
.pref{border-bottom:1px solid var(--line)}
.pref summary{list-style:none;display:grid;grid-template-columns:6.5em minmax(0,1fr) 4.5em;gap:10px;align-items:center;padding:10px 0;min-height:44px;cursor:pointer}
.pref summary::-webkit-details-marker{display:none}
.pref summary>span:first-child{display:flex;align-items:center;gap:6px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.num{text-align:right;font-size:13px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;min-height:36px;display:flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:4px;flex:none;background-size:cover;background-position:center;display:inline-block}
.dot.none{background:transparent;border:1px dashed var(--line)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.ph{border:0;padding:0;aspect-ratio:1;background:var(--soft);border-radius:8px;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(40,30,20,.55));padding:10px 6px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.cover{outline:3px solid var(--acc);outline-offset:-3px}
.ph.cover::after{content:"塗り中";position:absolute;top:4px;left:4px;background:var(--acc);color:#fff;font-size:11px;border-radius:4px;padding:1px 6px}
.empty{color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:0 16px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:#a2483e;border-color:#ead0cb}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.set{border-bottom:1px solid var(--line);padding:14px 0}.set p{margin:4px 0 0;font-size:13px;color:var(--sub)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1200;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(60,50,40,.16);max-height:70vh;overflow-y:auto;padding:8px 16px calc(20px + var(--sb));transform:translateY(105%);transition:transform .25s ease}
#sheet.open{transform:none}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sh-head{display:flex;align-items:flex-start;gap:8px}.sh-head h3{font-size:24px;margin:0;line-height:1.25}
.sh-head .p{margin:0;font-size:13px;color:var(--sub)}
.x{margin-left:auto;border:0;background:var(--soft);border-radius:999px;width:40px;height:40px;font-size:20px;flex:none}
.status{margin:6px 0 0;font-size:14px;color:var(--sub)}.status.done{color:var(--ink)}
.lbl{font-size:13px;color:var(--sub);margin:14px 0 6px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:14px;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.sw .phbtn{width:auto;padding:0 14px;background:var(--soft);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;border-color:var(--soft)}
.sw .phbtn svg{width:20px;height:20px}
#sheet details{margin-top:14px;font-size:14px}#sheet summary{min-height:40px;cursor:pointer;color:var(--sub)}
#sheet ul{margin:4px 0 12px;padding-left:20px}
#banner{position:fixed;left:12px;right:12px;top:calc(var(--st) + 176px);z-index:1050;background:var(--card);border-left:5px solid var(--acc);box-shadow:0 6px 20px rgba(60,50,40,.16);border-radius:12px;padding:12px 14px;display:none;align-items:center;gap:10px;font-size:14px}
#banner.on{display:flex}#banner button{margin-left:auto;background:var(--soft);border:0;border-radius:8px;min-height:36px;padding:0 12px;font-weight:700;flex:none}
#toast{position:fixed;left:50%;bottom:calc(80px + var(--sb));transform:translate(-50%,20px);z-index:1500;background:rgba(63,59,55,.92);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#lb{position:fixed;inset:0;z-index:1400;background:rgba(30,26,22,.94);display:none;flex-direction:column;color:#fff}
#lb.on{display:flex}#lb img{flex:1;min-height:0;width:100%;object-fit:contain}
#lb .cap{padding:12px 16px calc(14px + var(--sb));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#lb .cap div{flex:1 1 100%;font-size:14px}#lb .btn{background:transparent;color:#fff;border-color:#5a534c}#lb .btn.pri{background:var(--acc);border-color:var(--acc)}
dialog{border:0;border-radius:18px;padding:20px;max-width:340px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}dialog::backdrop{background:rgba(40,30,20,.4)}
dialog p{margin:0 0 16px}
@media (prefers-reduced-motion:reduce){#sheet,#toast{transition:none}}
input[type=file]{display:none}
</style>
</head>
<body>
<header>
  <div class="top"><h1>ぬりつぶし日本</h1><div id="count"></div></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="市区町村・都道府県名で探す" autocomplete="off" enterkeyhint="search">
    <div id="results"></div>
  </div>
  <p id="loadinfo"></p>
</header>
<div id="map"></div>
<div class="seg" id="seg"><button data-mode="muni" aria-pressed="true">市区町村</button><button data-mode="pref" aria-pressed="false">都道府県</button></div>
<div id="banner"><span id="bannerText"></span><button id="bannerCancel">やめる</button></div>

<section class="panel" id="p-rec"></section>
<section class="panel" id="p-photo"></section>
<section class="panel" id="p-set">
  <h2>設定</h2>
  <div class="set"><b>バックアップ</b><p>記録と写真はこのスマホのブラウザ内に保存されています。機種変更やブラウザのデータ削除に備えて、ときどき書き出してください。</p>
    <div class="row"><button class="btn" id="btnExport">書き出す</button><button class="btn" id="btnImport">読み込む</button></div></div>
  <div class="set"><b>地図データ</b><p id="dataInfo">市区町村境界を読み込み中…</p>
    <div class="row"><button class="btn" id="btnReload">境界データを再読み込み</button></div></div>
  <div class="set"><b>すべて消去</b><p>市区町村・都道府県の塗りと写真をこの端末から削除します。</p>
    <div class="row"><button class="btn danger" id="btnWipe">すべて消去する</button></div></div>
  <div class="set"><p>境界：国土交通省「国土数値情報（行政区域データ）」をSmartNews Media Research Instituteが加工したもの（2021年1月時点の区分）。都道府県の境界線：dataofjapan/land。</p></div>
</section>

<div id="sheet"></div>
<div id="lb"><img id="lbImg" alt=""><div class="cap"><div id="lbCap"></div>
  <button class="btn pri" id="lbCover">この写真で塗る</button><button class="btn" id="lbMap">地図で見る</button><button class="btn" id="lbDel">削除</button><button class="btn" id="lbClose">閉じる</button></div></div>
<dialog id="dlg"><p id="dlgText"></p><div class="row" style="justify-content:flex-end;margin:0"><button class="btn" id="dlgNo">キャンセル</button><button class="btn pri" id="dlgYes">OK</button></div></dialog>
<div id="toast"></div>

<nav>
  <button data-tab="map" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>地図</button>
  <button data-tab="rec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>記録</button>
  <button data-tab="photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>写真</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>設定</button>
</nav>

<input type="file" id="inPick" accept="image/*" multiple>
<input type="file" id="inFor" accept="image/*" multiple>
<input type="file" id="inCover" accept="image/*">
<input type="file" id="inImp" accept="application/json,.json">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
{
const $ = s => document.querySelector(s);
const PREFS = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
const COLORS = [['テラコッタ','#c4846c'],['アプリコット','#d4a27a'],['マスタード','#cdb071'],['セージ','#9fb09a'],['ミスト','#92b3b5'],['ブルーグレー','#8a9db5'],['ラベンダー','#a99bb8'],['ローズ','#c99ca3']];
const OLD = ['#e5502f','#f0932b','#eec33a','#3fa45b','#2fa4c9','#2f62c9','#8a55c2','#e2679a'];
const LAND = '#e7e1d8', EDGE = '#fbf9f6';
const pc = i => String(i).padStart(2, '0');
const isPref = c => c.length === 2;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => new Date(t).toLocaleDateString('ja-JP', {year:'numeric', month:'short', day:'numeric'});
const SVGNS = 'http://www.w3.org/2000/svg';
const ICON_PHOTO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>';

/* ---------- 保存（IndexedDB） ---------- */
let dbp;
const db = () => dbp || (dbp = new Promise((res, rej) => {
  const r = indexedDB.open('muni-nuri', 2);
  r.onupgradeneeded = () => {
    const d = r.result, has = n => d.objectStoreNames.contains(n);
    if (!has('visits')) d.createObjectStore('visits', {keyPath: 'code'});
    if (!has('photos')) d.createObjectStore('photos', {keyPath: 'id', autoIncrement: true}).createIndex('code', 'code');
    if (!has('prefs')) d.createObjectStore('prefs', {keyPath: 'code'});
  };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); let out;
    const r = fn(t.objectStore(store));
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const getAll = st => tx(st, 'readonly', s => s.getAll());
const put = (st, v) => tx(st, 'readwrite', s => s.put(v));
const del = (st, k) => tx(st, 'readwrite', s => s.delete(k));
const clearStore = st => tx(st, 'readwrite', s => s.clear());

/* ---------- 状態 ---------- */
const visits = new Map();      // 市区町村 code(5桁) -> {code,name,pref,color,coverId,dates[],first}
const prefV = new Map();       // 都道府県 code(2桁) -> {code,name,color,coverId,dates[],first}
let photos = [];               // {id,code(5桁 or 2桁),blob,thumb,ts}
const meta = new Map();        // code -> {name,pref}
const layers = new Map();      // code -> [canvasレイヤー]
const allLayers = [];
const loaded = new Set();
const urls = new Map();
const thumbURL = p => { const k = 't' + p.id; if (!urls.has(k)) urls.set(k, URL.createObjectURL(p.thumb || p.blob)); return urls.get(k); };
const recOf = c => (isPref(c) ? prefV : visits).get(c);
const storeOf = c => isPref(c) ? 'prefs' : 'visits';
const label = c => isPref(c) ? PREFS[+c - 1] : ((visits.get(c) || meta.get(c) || {}).name || c);
let current = null, assignQueue = [];
let mode = 'muni';
let lastColor = COLORS[0][1];
try { lastColor = localStorage.getItem('nuri-color') || lastColor; mode = localStorage.getItem('nuri-mode') || 'muni'; } catch (e) {}
const migrate = c => { const i = OLD.indexOf(c); return i >= 0 ? COLORS[i][1] : c; };
lastColor = migrate(lastColor);
const coverOf = v => v && v.coverId != null ? photos.find(p => p.id === v.coverId && (p.code === v.code || (isPref(v.code) && p.code.slice(0, 2) === v.code))) : null;
const swatchCSS = v => { const c = coverOf(v); return c ? `background-image:url(${thumbURL(c)})` : `background:${v.color || lastColor}`; };

/* ---------- 地図（背景画像なしのシンプルな地図） ---------- */
const map = L.map('map', {zoomControl: false, preferCanvas: true, attributionControl: true}).setView([37.5, 137.5], 5);
map.attributionControl.setPrefix('').addAttribution('境界：国土数値情報（行政区域）を加工');
map.createPane('outline').style.zIndex = 450;
map.getPane('outline').style.pointerEvents = 'none';
const renderer = L.canvas({padding: .3, tolerance: 4});
const outlineR = L.canvas({padding: .3, pane: 'outline'});
const svgR = L.svg({padding: .5});
function style(code) {
  const base = {renderer, stroke: true, opacity: 1, fillOpacity: 1};
  if (mode === 'pref') {
    const pv = prefV.get(code.slice(0, 2)), c = pv && !coverOf(pv) ? pv.color : LAND;
    return {...base, color: c, weight: .6, fillColor: c};
  }
  const v = visits.get(code);
  return {...base, color: EDGE, weight: .7, fillColor: v && !coverOf(v) ? v.color : LAND};
}
const restyleAll = () => allLayers.forEach(l => l.setStyle(style(l._code)));

/* 都道府県の境界線（見た目用） */
let outlineLayer = null;
async function loadOutline() {
  if (outlineLayer) return;
  try {
    const gj = await fetchJSON(['https://cdn.jsdelivr.net/gh/dataofjapan/land@master/japan.geojson', 'https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson']);
    outlineLayer = L.geoJSON(gj, {renderer: outlineR, interactive: false, style: {renderer: outlineR, color: EDGE, weight: 1.6, opacity: .95, fill: false}}).addTo(map);
  } catch (e) {}
}

/* 写真で塗る：SVGパターンで形に写真を切り抜く */
const photoLayers = new Map(); // code -> {group, el, img, bounds, url}
function defs() {
  const svg = svgR._container; if (!svg) return null;
  let d = svg.querySelector('defs'); if (!d) { d = document.createElementNS(SVGNS, 'defs'); svg.insertBefore(d, svg.firstChild); }
  return d;
}
function placePattern(e) {
  const a = map.latLngToLayerPoint(e.bounds.getNorthWest()), z = map.latLngToLayerPoint(e.bounds.getSouthEast());
  const w = Math.max(1, z.x - a.x), h = Math.max(1, z.y - a.y);
  e.el.setAttribute('x', a.x); e.el.setAttribute('y', a.y); e.el.setAttribute('width', w); e.el.setAttribute('height', h);
  e.img.setAttribute('width', w); e.img.setAttribute('height', h);
}
function clearPhotoLayer(code) {
  const e = photoLayers.get(code); if (!e) return;

}
const prefLayers = p => allLayers.filter(l => l._code.slice(0, 2) === p);
function drawPhotoLayer(code) {

  const cov = coverOf(recOf(code)), ls = isPref(code) ? prefLayers(code) : layers.get(code);
  if (!cov || !ls || !ls.length) return;
  const url = URL.createObjectURL(cov.blob), group = L.featureGroup().addTo(map), subs = [];
  for (const l of ls) {
    const sub = L.GeoJSON.geometryToLayer(l.feature, {renderer: svgR, opacity: 1, fillOpacity: 1, weight: isPref(code) ? .8 : .7});
    group.addLayer(sub); subs.push(sub);

  }
  const d = defs(); if (!d) { map.removeLayer(group); URL.revokeObjectURL(url); return; }
  const id = `pt-${code}-${Date.now()}`;
  const el = document.createElementNS(SVGNS, 'pattern'); el.setAttribute('id', id); el.setAttribute('patternUnits', 'userSpaceOnUse');
  const img = document.createElementNS(SVGNS, 'image');
  img.setAttribute('href', url); img.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
  img.setAttribute('preserveAspectRatio', 'xMidYMid slice'); img.setAttribute('x', 0); img.setAttribute('y', 0);
  el.appendChild(img); d.appendChild(el);
  subs.forEach(s => s.setStyle({fillColor: `url(#${id})`, color: isPref(code) ? `url(#${id})` : EDGE}));
  const e = {group, el, img, url, bounds: L.featureGroup(ls).getBounds()};
  photoLayers.set(code, e); placePattern(e);
}
map.on('zoomend viewreset', () => requestAnimationFrame(() => photoLayers.forEach(placePattern)));
function refresh(code) {
  (isPref(code) ? prefLayers(code) : (layers.get(code) || [])).forEach(l => l.setStyle(style(l._code)));
  drawPhotoLayer(code);
}
function setMode(m) {

  closeSheet();
  [...photoLayers.keys()].forEach(clearPhotoLayer);
  restyleAll();
  (m === 'pref' ? prefV : visits).forEach((v, c) => drawPhotoLayer(c));
  renderCounts();
}

/* ---------- 市区町村境界データ ---------- */
const nameOf = p => {
  const a = p.N03_003 || '', b = p.N03_004 || '';
  if (!b) return a; if (!a || a.endsWith('郡')) return b; return a + b;
};
async function fetchJSON(list) {
  for (const u of list) { try { const r = await fetch(u); if (r.ok) return await r.json(); } catch (e) {} }
  throw new Error('load failed');
}
const sources = p => {
  const f = `data/municipality/geojson/s0010/N03-21_${p}_210101.json`;
  return [`https://cdn.jsdelivr.net/gh/smartnews-smri/japan-topography@main/${f}`,
          `https://raw.githubusercontent.com/smartnews-smri/japan-topography/main/${f}`];
};
const pending = new Map();
function loadPref(i) {
  if (pending.has(i)) return pending.get(i);
  const p = (async () => {
    const gj = await fetchJSON(sources(pc(i)));
    L.geoJSON(gj, {
      renderer,
      filter: f => f.properties && f.properties.N03_007,
      style: f => style(String(f.properties.N03_007).padStart(5, '0')),
      onEachFeature: (f, l) => {
        const code = String(f.properties.N03_007).padStart(5, '0');
        l._code = code; allLayers.push(l);
        if (!meta.has(code)) meta.set(code, {name: nameOf(f.properties), pref: f.properties.N03_001 || PREFS[i - 1]});
        if (!layers.has(code)) layers.set(code, []);
        layers.get(code).push(l);
        l.on('click', e => { L.DomEvent.stop(e); onMuniTap(code); });
      }
    }).addTo(map);
    loaded.add(i);
    for (const v of visits.values()) if (+v.code.slice(0, 2) === i) refresh(v.code);
    if (prefV.has(pc(i))) refresh(pc(i));
    renderCounts();
  })();
  pending.set(i, p);
  p.catch(() => pending.delete(i));
  return p;
}
async function loadAll() {
  const q = []; for (let i = 1; i <= 47; i++) if (!loaded.has(i)) q.push(i);
  let fail = 0;
  const worker = async () => { while (q.length) { const i = q.shift(); try { await loadPref(i); } catch (e) { fail++; } loadInfo(); } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  loadInfo(fail);
}
function loadInfo(fail) {
  const n = loaded.size, empty = mode === 'pref' ? !prefV.size : !visits.size;
  $('#loadinfo').textContent = n < 47
    ? (fail ? `地図データ ${n}/47（一部読み込めませんでした。設定から再読み込みできます）` : `地図を準備中 ${n}/47`)
    : (empty ? (mode === 'pref' ? '行った都道府県をタップして塗りましょう' : '行った市区町村をタップして塗りましょう') : '');
  $('#dataInfo').textContent = `${n}/47 都道府県分の境界を読み込み済み・${meta.size} 市区町村`;
}

/* ---------- 記録 ---------- */
async function paint(code, opts = {}) {
  const M = isPref(code) ? prefV : visits;
  let v = M.get(code); const isNew = !v; const t = Date.now();
  if (!v) v = {code, dates: [t], first: t, color: lastColor, coverId: null};
  if (opts.color) { v.color = opts.color; v.coverId = null; lastColor = opts.color; try { localStorage.setItem('nuri-color', lastColor); } catch (e) {} }
  if (opts.coverId !== undefined) v.coverId = opts.coverId;
  if (!v.color) v.color = lastColor;
  if (isPref(code)) v.name = PREFS[+code - 1];
  else { const m = meta.get(code); v.name = m ? m.name : (v.name || code); v.pref = m ? m.pref : (v.pref || PREFS[+code.slice(0, 2) - 1] || ''); }
  M.set(code, v);
  await put(storeOf(code), v);
  refresh(code); renderCounts();
  if (isNew) toast(`${v.name} を塗りました`);
  return v;
}
async function addDay(code) {
  const v = recOf(code); if (!v) return;
  const day = new Date().toDateString();
  if (v.dates.some(d => new Date(d).toDateString() === day)) return toast('今日の日付はもう記録されています');
  v.dates.push(Date.now()); await put(storeOf(code), v); toast('今日の日付を追加しました');
}
async function unpaint(code) {
  (isPref(code) ? prefV : visits).delete(code); await del(storeOf(code), code);
  for (const p of photos.filter(p => p.code === code)) await removePhoto(p.id);
  refresh(code); renderCounts();
}

/* ---------- 写真 ---------- */
async function resize(file, max, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
async function savePhoto(file, code) {
  const ts = (await exifDate(file)) || file.lastModified || Date.now();
  const [blob, thumb] = await Promise.all([resize(file, 1600, .85), resize(file, 360, .75)]);
  const rec = {code, blob, thumb, ts, added: Date.now()};
  rec.id = await put('photos', rec);
  photos.push(rec);
  return rec;
}
async function addPhotos(files, code) {
  if (!recOf(code)) await paint(code);
  let ok = 0;
  for (const f of files) { try { await savePhoto(f, code); ok++; } catch (e) { toast('読み込めない画像がありました'); } }
  if (ok) toast(`${ok}枚を ${label(code)} に追加しました`);
  renderCounts(); if (tab === 'photo') renderPhotos(); if (current === code) openSheet(code);
}
async function removePhoto(id) {
  await del('photos', id);
  photos = photos.filter(x => x.id !== id);
  const k = 't' + id; if (urls.has(k)) { URL.revokeObjectURL(urls.get(k)); urls.delete(k); }
  for (const v of [...visits.values(), ...prefV.values()]) if (v.coverId === id) { v.coverId = null; await put(storeOf(v.code), v); refresh(v.code); }
}
/* 写真のEXIFから撮影日だけを読む */
async function exifDate(file) {
  try {
    const v = new DataView(await file.slice(0, 131072).arrayBuffer());
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o + 10 < v.byteLength) {
      const mk = v.getUint16(o); if ((mk & 0xFF00) !== 0xFF00) break;
      if (mk === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
        const t = o + 10, le = v.getUint16(t) === 0x4949;
        const u16 = x => v.getUint16(x, le), u32 = x => v.getUint32(x, le);
        const find = (off, tag) => { const n = u16(t + off); for (let i = 0; i < n; i++) { const e = t + off + 2 + i * 12; if (u16(e) === tag) return e; } return null; };
        const ex = find(u32(t + 4), 0x8769); if (!ex) return null;
        const de = find(u32(ex + 8), 0x9003); if (!de) return null;
        const off = t + u32(de + 8); let s = ''; for (let i = 0; i < 19; i++) s += String.fromCharCode(v.getUint8(off + i));
        const m = s.match(/(\d+):(\d+):(\d+) (\d+):(\d+):(\d+)/);
        return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime() : null;
      }
      o += 2 + v.getUint16(o + 2);
    }
  } catch (e) {}
  return null;
}

function openSheet(code) {

const closeSheet = () => { $('#sheet').classList.remove('open'); current = null; };
function flyTo(code) {

  if (ls && ls.length) map.flyToBounds(L.featureGroup(ls).getBounds(), {paddingTopLeft: [30, 180], paddingBottomRight: [30, Math.round(innerHeight * .45)], maxZoom: isPref(code) ? 9 : 12});
}

/* 写真タブから追加した写真を地図タップで割り当て */

  $('#bannerText').textContent = `写真 ${assignQueue.length}枚：登録する${mode === 'pref' ? '都道府県' : '市区町村'}を地図でタップしてください`;
}

/* ---------- 検索 ---------- */
function search(term) {
  const r = $('#results'); term = term.trim();
  if (!term) { r.classList.remove('on'); r.innerHTML = ''; return; }
  const hits = [];
  PREFS.forEach((n, k) => { if (n.includes(term)) hits.push([pc(k + 1), n, '都道府県', n.startsWith(term) ? 0 : 1]); });
  for (const [code, m] of meta) if (m.name.includes(term) || (m.pref + m.name).includes(term)) hits.push([code, m.name, m.pref, m.name.startsWith(term) ? 0 : 1]);
  hits.sort((a, b) => a[3] - b[3] || a[0].length - b[0].length || a[0].localeCompare(b[0]));
  r.innerHTML = hits.slice(0, 14).map(([code, n, s]) => { const v = recOf(code);
    return `<button data-code="${code}"><span>${esc(n)} <small>${esc(s)}</small></span>${v ? `<i style="${swatchCSS(v)}"></i>` : ''}</button>`; }).join('')
    || `<button disabled><small>${loaded.size < 47 ? '地図を準備中です。少し待ってからもう一度お試しください' : '見つかりませんでした'}</small></button>`;
  r.classList.add('on');
}

/* ---------- バックアップ ---------- */
const toDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
async function exportData() {
  toast('書き出し中…');
  const out = {app: 'muni-nuri', version: 3, exported: Date.now(), visits: [...visits.values()], prefs: [...prefV.values()], photos: []};
  for (const p of photos) out.photos.push({oid: p.id, code: p.code, ts: p.ts, blob: await toDataURL(p.blob), thumb: await toDataURL(p.thumb || p.blob)});
  const url = URL.createObjectURL(new Blob([JSON.stringify(out)], {type: 'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = `nuritsubushi-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function importData(file) {
  try {
    const j = JSON.parse(await file.text()); if (j.app !== 'muni-nuri') throw 0;
    const idMap = new Map();
    for (const p of j.photos || []) {
      const rec = {code: p.code, ts: p.ts, blob: await (await fetch(p.blob)).blob(), thumb: await (await fetch(p.thumb)).blob(), added: Date.now()};
      rec.id = await put('photos', rec); photos.push(rec); idMap.set(p.oid, rec.id);
    }
    for (const v of [...(j.visits || []), ...(j.prefs || [])]) {
      const M = isPref(v.code) ? prefV : visits;
      const nv = {...v, color: migrate(v.color || COLORS[0][1]), coverId: v.coverId != null && idMap.has(v.coverId) ? idMap.get(v.coverId) : null};
      const cur = M.get(v.code);
      if (cur) { nv.dates = [...new Set([...cur.dates, ...v.dates])].sort((a, b) => a - b); nv.first = Math.min(cur.first, v.first); }
      M.set(v.code, nv); await put(storeOf(v.code), nv); refresh(v.code);
    }
    renderCounts(); toast('読み込みました');
  } catch (e) { toast('バックアップファイルを読み込めませんでした'); }
}

  $('#q').value = ''; search(''); $('#q').blur(); go(b.dataset.code);
});
$('#inPick').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; if (!fs.length) return; assignQueue = fs; showTab('map'); setBanner(); };
$('#inFor').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length && current) addPhotos(fs, current); };
$('#inCover').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !current) return;
  const code = current;
  try { if (!recOf(code)) await paint(code); const rec = await savePhoto(f, code); await paint(code, {coverId: rec.id}); toast('写真で塗りました'); openSheet(code); }
  catch (err) { toast('この画像は読み込めませんでした'); }
};
$('#inImp').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importData(f); };
$('#bannerCancel').onclick = () => { assignQueue = []; setBanner(); };

$('#sheet').addEventListener('click', async e => {
  const ph = e.target.closest('[data-ph]'); if (ph) return openPhoto(+ph.dataset.ph);
  if (!current) return;
  const code = current, col = e.target.closest('[data-color]');
  if (col) { await paint(code, {color: col.dataset.color}); return openSheet(code); }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'close') closeSheet();
  if (act === 'cover') $('#inCover').click();
  if (act === 'photo') $('#inFor').click();
  if (act === 'today') addDay(code);
  if (act === 'unmark' && await ask(`${label(code)}の塗りを消します。${isPref(code) ? '都道府県に直接登録した写真' : '登録した写真'}も削除されます。よろしいですか？`, '消す')) { await unpaint(code); openSheet(code); }
});
$('#p-rec').addEventListener('click', e => { const c = e.target.closest('[data-code]'); if (c) go(c.dataset.code); });
$('#p-photo').addEventListener('click', e => { const ph = e.target.closest('[data-ph]'); if (ph) openPhoto(+ph.dataset.ph); });
$('#lbClose').onclick = closePhoto;
$('#lbCover').onclick = async () => { const p = photos.find(x => x.id === lbId); if (!p) return; const tgt = coverTarget(p); if (!tgt) return; await paint(tgt, {coverId: p.id}); closePhoto(); toast('写真で塗りました'); if (tab === 'photo') renderPhotos(); if (current) openSheet(current); };
$('#lbMap').onclick = () => { const p = photos.find(x => x.id === lbId); closePhoto(); if (p) go(mode === 'pref' ? p.code.slice(0, 2) : p.code); };
$('#lbDel').onclick = async () => { if (!await ask('この写真を削除しますか？', '削除する')) return; await removePhoto(lbId); closePhoto(); renderCounts(); if (tab === 'photo') renderPhotos(); if (current) openSheet(current); };
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
map.on('click', () => { closeSheet(); search(''); });
$('#btnExport').onclick = exportData;
$('#btnImport').onclick = () => $('#inImp').click();
$('#btnReload').onclick = () => { toast('再読み込み中…'); loadAll(); loadOutline(); };
$('#btnWipe').onclick = async () => {
  if (!await ask('すべての塗りと写真を削除します。元に戻せません。', 'すべて消去')) return;
  await clearStore('visits'); await clearStore('photos'); await clearStore('prefs');
  [...photoLayers.keys()].forEach(clearPhotoLayer);
  visits.clear(); prefV.clear(); photos = []; restyleAll(); renderCounts(); toast('消去しました');
};

/* ---------- 起動 ---------- */
(async () => {
  try {
    for (const v of await getAll('visits')) { v.color = migrate(v.color); visits.set(v.code, v); }
    for (const v of await getAll('prefs')) prefV.set(v.code, v);
    photos = await getAll('photos');
  } catch (e) { toast('この端末のブラウザでは保存が使えません'); }
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  renderCounts();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  loadOutline();
  const first = [...new Set([...visits.keys(), ...prefV.keys()].map(c => +c.slice(0, 2)))].filter(i => i >= 1 && i <= 47);
  await Promise.all(first.map(i => loadPref(i).catch(() => {})));
  loadAll();
})();
}
</script>
</body>
</html>
